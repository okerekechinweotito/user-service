services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: user-service-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-userservice}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-service-network

  # User Service Application
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-app
    ports:
      - "3000:3000"
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/userservice}

      # RabbitMQ connection (connect to external/shared instance in notification system)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_URL: ${RABBITMQ_URL}

      # Application settings
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}

      # JWT Secrets
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-service-network
      # Uncomment below when connecting to external notification system
      # - notification-system-network
    # Uncomment for hot-reload during development
    # volumes:
    #   - ./src:/usr/src/app/src
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  user-service-network:
    driver: bridge
  # Uncomment below when the external notification system is running
  # notification-system-network:
  #   external: true
  #   name: notification-system_default
